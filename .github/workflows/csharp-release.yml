name: C# package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version
        required: true
        default: 0.9.0-beta.25

jobs:
  verify:
    uses: ./.github/workflows/csharp-ci.yml

  package:
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check version input (SemVer)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "version must be SemVer such as 1.2.3 or 1.2.3-beta.1: '$VERSION'" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish management window (Tray, self-contained, win-x64)
        run: dotnet publish csharp/src/AsterCache.Tray/AsterCache.Tray.csproj -c Release -r win-x64 --self-contained -p:Version=${{ inputs.version }} -o artifacts/gui
      - name: Check management window bundle
        shell: pwsh
        run: |
          foreach ($exe in 'AsterCache.Tray.exe', 'aster.exe', 'AsterCache.Service.exe') {
            if (-not (Test-Path -LiteralPath "artifacts/gui/$exe")) { throw "Missing $exe in artifacts/gui" }
          }
      - name: Zip management window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases/gui | Out-Null
          Compress-Archive -Path 'artifacts/gui/*' -DestinationPath "releases/gui/AsterCache-${{ inputs.version }}-win-x64.zip"
      - name: Warn about signing
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE) { Write-Warning 'Unsigned Windows artifacts: configure signing secrets before public release.' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer (management window bundle, service and data ACL)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found: $iscc" }
          $ws = $env:GITHUB_WORKSPACE
          $num = '${{ inputs.version }}'.Split('-')[0]
          & $iscc "/DAppVersion=${{ inputs.version }}" "/DAppNumVersion=$num" "/DAppDir=$ws\artifacts\gui" "/DOutputDir=$ws\artifacts\installer" "$ws\csharp\packaging\windows\aster.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: AsterCache-win-x64-${{ inputs.version }}
          path: |
            artifacts/installer
            releases/gui

  release:
    needs: package
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AsterCache-win-x64-${{ inputs.version }}
          path: dist
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRERELEASE_FLAG: ${{ contains(inputs.version, '-') && '--prerelease' || '' }}
        run: |
          assets=(dist/releases/gui/*.zip dist/artifacts/installer/*.exe)
          gh release create "v$VERSION" "${assets[@]}" \
            --target "${{ github.sha }}" \
            --title "AsterCache v$VERSION" \
            --generate-notes $PRERELEASE_FLAG

# Runs after verify and package. Publishes a GitHub release with the management-window zip and the
# Inno Setup installer. A version containing "-" (e.g. 0.9.0-beta.1) is marked as a prerelease.
# The installer and the zip both carry the whole artifacts/gui folder (Tray, aster.exe, service, runtime);
# the service is registered by the installer only when the "service" task is selected.
# Signing is not configured: the signing warning step only reminds that artifacts are unsigned.
